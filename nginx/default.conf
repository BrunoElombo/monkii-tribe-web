# Serves the PWA on its own (no TLS, no API). Good for a quick look at a build:
#   docker run --rm -p 8080:80 monkii/web
# The platform's real entry point (TLS + /api -> gateway) lives in monkii-infra/nginx.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and manifest must always be fresh so updates roll out
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths serve the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
